<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymManager API 테스트</title>
<style>
:root{color-scheme:light;--ink:#142439;--muted:#52647b;--line:#dce4ec;--bg:#f2f5f9;--accent:#17624e;--nav:#132438;--paper:#fff;font:15px/1.55 system-ui,"Malgun Gothic",sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}button:disabled{cursor:wait;opacity:.65}
:focus-visible{outline:3px solid #30a688;outline-offset:2px}
.shell{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}
aside{background:var(--nav);color:#dce9f4;padding:28px 17px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:11px;align-items:center;margin:0 6px 36px;font-weight:750;color:white;letter-spacing:-.025em}
.brand-mark{display:grid;place-items:center;background:#277e68;width:37px;height:37px;border-radius:10px;color:#fff;font:700 16px ui-monospace,monospace}
.nav-heading{display:block;font-size:.79rem;color:#a7b9cb;margin:0 10px 12px}
nav{display:grid;gap:6px}nav button{text-align:left;background:none;color:inherit;border:1px solid transparent;border-radius:8px;padding:10px 12px}
nav button[aria-pressed=true]{background:#254454;border-color:#456777;color:white;font-weight:700}nav button:hover{background:#294252}
main{max-width:1600px;width:100%;padding:30px clamp(18px,3vw,47px) 45px;margin:auto}
h1,h2,h3,p{margin:0}h1{font-size:clamp(1.6rem,3vw,2.3rem);letter-spacing:-.055em}h2{font-size:1.13rem;letter-spacing:-.035em}h3{font-size:.93rem}
.lead{margin:4px 0 22px;color:var(--muted)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:19px;box-shadow:0 2px 4px #14243908;min-width:0}

.note{font-size:.82rem;color:var(--muted);margin-top:8px}.notice{background:#fff7e7;border:1px solid #f1d7a2;color:#62470e;border-radius:8px;padding:9px 11px;margin:13px 0 0}
.columns{display:grid;grid-template-columns:minmax(285px, .86fr) minmax(0,1.14fr);gap:16px;align-items:start}
.stack{display:grid;gap:16px;min-width:0}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px}.fields{display:grid;gap:11px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
label{display:grid;gap:4px;font-size:.86rem;font-weight:650;min-width:0}
input:not([type=checkbox]),select,textarea{width:100%;background:white;color:var(--ink);border:1px solid #c8d4e0;border-radius:7px;padding:7px 9px;min-width:0}
input[type=checkbox]{accent-color:var(--accent)}input[type=file]{font-size:.8rem}
textarea,pre{font:13px/1.55 ui-monospace,Consolas,"Malgun Gothic",monospace}
textarea#payload{min-height:230px;resize:vertical;background:#f8fafc;tab-size:2}
pre{margin:10px 0 0;background:#14263b;color:#e6eff8;border-radius:8px;padding:12px;min-height:120px;max-height:400px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.btn{border:1px solid #c8d4e0;background:#fff;color:var(--ink);border-radius:7px;padding:6px 10px;font-size:.83rem;font-weight:650}
.btn:hover{background:#ecf2f6}.primary{background:var(--accent);color:white;border-color:var(--accent);padding:8px 14px}.primary:hover{background:#0e503e}
.actions{display:flex;gap:7px;flex-wrap:wrap}.selection{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 8px;margin-top:6px}.check{display:flex;align-items:center;gap:5px;font-weight:500}.nested{grid-column:1/-1;padding-left:10px;border-left:2px solid var(--line)}

.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.metrics div{background:#f2f6fa;border-radius:7px;padding:6px 8px;font-size:.77rem;color:var(--muted);overflow-wrap:anywhere}.metrics strong{display:block;color:var(--ink);font-size:.88rem}.status{font-weight:700;color:var(--accent)}.status[data-error=true]{color:#a8322d}
#message,#form-message{margin-top:8px;overflow-wrap:anywhere}.error{color:#a8322d}.image{margin-top:12px}.image img{display:block;max-width:100%;max-height:300px;margin-top:6px;border-radius:7px}.muted{color:var(--muted)}[hidden]{display:none!important}
@media(max-width:1000px){.shell{grid-template-columns:180px minmax(0,1fr)}.columns{grid-template-columns:1fr}}
@media(max-width:680px){.shell{display:block}aside{height:auto;position:static;padding:13px}nav{grid-template-columns:repeat(2,1fr)}.brand{margin:0 0 8px}.nav-heading{display:none}main{padding:14px}.pair{grid-template-columns:1fr}}
</style>
</head>

    <button type="button" data-mode="uploadPhoto" aria-pressed="false">사진 추가·교체</button>

</aside>
<main>

      <p id="form-message" class="note error" role="status"></p>
    </section>
    <div class="stack">
      <section class="panel" aria-labelledby="request-title">

          <button type="button" class="btn" id="copy-request">요청 복사</button>
          <button type="button" class="btn primary" id="send">요청 전송</button>
        </div></div>
        <textarea id="payload" aria-label="전송할 요청 JSON" spellcheck="false"></textarea>
        <p id="request-note" class="note" role="status">편집기에 표시된 JSON을 그대로 전송합니다.</p>
      </section>
      <section class="panel" aria-labelledby="response-title">
        <div class="bar"><h2 id="response-title">응답</h2><button type="button" class="btn" id="copy-response">응답 복사</button></div>
        <div class="bar"><span class="status" id="status" role="status">대기 중</span></div>
        <div class="metrics">
          <div>API 오류 코드<strong id="code">—</strong></div>
          <div>실행 소요 시간<strong id="duration">—</strong></div>
        </div>
        <p id="message" class="note" role="status"></p>
        <pre id="response" aria-label="응답 본문">응답이 여기에 표시됩니다.</pre>
        <div class="image" id="image-panel" hidden><h3>표시용 WebP</h3><img id="image" alt="조회한 회원 사진"></div>
      </section>
    </div>
  </div>
</main>
</div>

  parts.push(bytes.subarray(retainedFrom));
  return new Blob(parts, { type: mime });
}
async function convertPhoto(file) {
  const formats = { jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', webp:'image/webp', heic:'image/heic', heif:'image/heif' };
  const extension = /\.([a-z]+)$/i.exec(file.name)?.[1].toLowerCase();
  if (!own(formats, extension)) throw new Error('JPEG, PNG, WebP, HEIC 또는 HEIF 파일을 선택하세요.');
  const mime = formats[extension];
  if (!window.createImageBitmap) throw new Error('이 브라우저는 사진 픽셀을 읽는 기능을 지원하지 않습니다.');

  let bitmap;
  try {
    // The API compares encoded dimensions, before any EXIF rotation.
    bitmap = await createImageBitmap(await photoDecodeSource(file, mime), { imageOrientation: 'none' });
  } catch (_) {
    throw new Error(extension === 'heic' || extension === 'heif'
      ? '이 브라우저에서 HEIC/HEIF 사진을 열 수 없습니다. 지원하는 브라우저를 사용하거나 JPEG 또는 PNG 파일을 선택하세요.'
      : '사진을 열 수 없습니다. 파일이 손상되었거나 브라우저에서 해당 이미지를 지원하지 않습니다.');
  }

  const { width, height } = bitmap;
  const quality = 0.8;
  let webp;
  const canvas = node('canvas');
  try {
    canvas.width = width;
    canvas.height = height;
    canvas.getContext('2d').drawImage(bitmap, 0, 0);
    webp = await new Promise(resolve => canvas.toBlob(resolve, 'image/webp', quality));
    if (!webp?.size || webp.type !== 'image/webp') throw new Error();
  } catch (_) {
    throw new Error('원본 해상도의 WebP를 만들지 못했습니다. 브라우저의 WebP 인코딩 지원과 이미지 크기를 확인하세요.');
  } finally {
    bitmap.close();
    canvas.width = canvas.height = 0;
  }
  const [originalData, displayData] = await Promise.all([photoBase64(file), photoBase64(webp)]);
  return { webpSize: webp.size, photo: {
    가로: width, 세로: height, 품질: quality,
    원본: { 파일명: file.name, 매체유형: mime, 데이터: originalData },
    표시본: { 파일명: file.name.replace(/\.[^.]+$/, '.webp'), 매체유형: 'image/webp', 데이터: displayData }
  } };
}
function photoFields() {
  const panel = node('fieldset'); panel.append(node('legend', '사진 파일'));
  const original = input('file'); original.accept = '.jpg,.jpeg,.png,.webp,.heic,.heif';
  const details = node('div'); details.className = 'image'; details.hidden = true;
  const preview = node('img'); preview.alt = '변환된 회원 사진 미리보기';
  const summary = node('p'); summary.className = 'note';
  details.append(preview, summary);
  const message = node('p', '원본을 선택하면 같은 해상도의 품질 80% WebP를 생성합니다.');
  message.className = 'note';
  message.setAttribute('role', 'status');
  panel.append(label('원본 파일', original), message, details);

  let selection = 0;
  let photo;
  let photoError = '원본 사진을 선택하세요.';
  original.addEventListener('change', async event => {
    event.stopPropagation();
    const version = ++selection;
    const file = original.files[0];
    photo = undefined;
    details.hidden = true;
    preview.removeAttribute('src');
    editor.value = '';
    el('form-message').textContent = '';
    formChanged();
    photoError = file ? '사진 변환이 완료될 때까지 기다리세요.' : '원본 사진을 선택하세요.';
    message.classList.remove('error');
    message.textContent = photoError;
    if (!file) return;
    const stillSelected = () => version === selection && panel.isConnected && original.files[0] === file;
    try {
      const result = await convertPhoto(file);
      if (!stillSelected()) return;
      photo = result.photo;
      preview.src = 'data:image/webp;base64,' + photo.표시본.데이터;
      summary.textContent = `${photo.가로} × ${photo.세로} px · 원본 ${file.size.toLocaleString('ko-KR')} 바이트 · WebP ${result.webpSize.toLocaleString('ko-KR')} 바이트`;
      details.hidden = false;
      message.textContent = '사진 변환 완료';
      if (!panel.hidden && editor.value === '') void build();
    } catch (error) {
      if (!stillSelected()) return;
      photoError = error.message;
      message.classList.add('error');
      message.textContent = photoError;
    }
  });
  return { panel, read() {
    if (!photo) throw new Error(photoError);
    return photo;
  } };
}
function showCommand() {
  const isPhoto = ['uploadPhoto', 'getPhoto', 'removePhoto'].includes(mode);
  const table = isPhoto ? '회원' : target;
  const [key, schema, refs = []] = tables[table];
  let id, expected, attach, photo;
  const values = [];
  if (mode !== 'create') {
    id = input();
    fields.append(label(key, id));
  }
  if (['uploadPhoto','removePhoto'].includes(mode)) {
    expected = input('text', '사진이 없으면 빈 값');
    fields.append(label('현재 표시용 WebP 파일 ID', expected));
  }
  if (['create','update'].includes(mode)) {
    const definitions = mode === 'create' && table === '회원' ? { 회원id:'문자열', ...schema } : schema;
    for (const [name, type] of Object.entries(definitions)) {
      if ((mode === 'update' && refs.includes(name)) || (mode === 'create' && name === '복귀일')) continue;
      const optional = type.endsWith('?');
      const kind = type.replace('?', '');
      const control = input(kind === '숫자' ? 'number' : kind === '날짜' ? 'date' : 'text',
        kind === '일시' ? '2026-11-24T09:00:00+09:00' : '');
      if (kind === '숫자') control.step = '1';
      fields.append(label(name + (optional ? ' (선택)' : mode === 'create' ? ' (필수)' : ''), control));
      values.push([name, control, kind]);
    }
  }
  if (mode === 'create' && table === '회원') {
    const [wrapper, control] = check('사진 함께 등록');
    attach = control;
    photo = photoFields();
    photo.panel.hidden = true;
    control.addEventListener('change', () => {
      photo.panel.hidden = !control.checked;
      editor.value = '';
    });
    fields.append(wrapper, photo.panel);
  } else if (mode === 'uploadPhoto') {
    photo = photoFields();
    fields.append(photo.panel);
  }
  if (photo) {
    verifyPhoto = request => {
      if (attach && !attach.checked && !own(request, 'photo')) return;
      if (attach && !attach.checked) throw new Error('사진을 보내려면 ‘사진 함께 등록’을 선택하세요.');
      const current = photo.read();
      const candidate = request.photo;
      const sameImage = (actual, expected) => isObject(actual) &&
        Object.keys(expected).every(key => actual[key] === expected[key]);
      if (candidate?.가로 !== current.가로 || candidate?.세로 !== current.세로 ||
          candidate?.품질 !== current.품질 || !sameImage(candidate.원본, current.원본) ||
          !sameImage(candidate.표시본, current.표시본)) {
        throw new Error('현재 선택한 사진으로 요청 JSON을 다시 생성하세요.');
      }
    };
  }
  if (mode === 'update') {
    const note = node('p', '값을 입력한 필드만 수정합니다. 선택 필드를 비우려면 요청 JSON에서 해당 필드를 null로 지정하세요.');
    note.className = 'note'; fields.append(note);
  }
  return async () => {
    const request = { action: mode, table };
    if (id) request.id = id.value;
    if (expected) request.expectedPhotoId = expected.value;
    if (['create', 'update'].includes(mode)) {
      request.data = Object.fromEntries(values.filter(([, control]) => control.value !== '')
        .map(([name, control, kind]) => [name, kind === '숫자' ? control.valueAsNumber : control.value]));
    }
    if (photo && (!attach || attach.checked)) request.photo = await photo.read();
    return request;
  };
}
function render() {
  formVersion++;
  verifyPhoto = undefined;
  fields.replaceChildren();
  el('form-title').textContent = document.querySelector(`[data-mode="${mode}"]`).textContent;
  if (!['uploadPhoto','getPhoto','removePhoto'].includes(mode)) {
    const picker = select(Object.keys(mode === 'view' ? viewFields : tables));
    picker.value = target;
    picker.addEventListener('change', event => {
      event.stopPropagation();
      target = picker.value;
      render();
    });
    fields.append(label(mode === 'view' ? '조회 뷰' : '대상 테이블', picker));
  }
  readForm = mode === 'view' ? showView() : showCommand();
  void build(true);
}
function formChanged() {
  formVersion++;
  needsBuild = true;
  el('request-note').textContent = '입력이 변경되었습니다. 전송 본문에 반영하려면 ‘입력으로 생성’을 누르세요.';
}
async function build(clearOnError = false) {
  const version = formVersion;
  const edit = ++editVersion;
  if (clearOnError) editor.value = '';
  el('form-message').textContent = '';
  try {
    const request = await readForm();
    if (version !== formVersion || edit !== editVersion) return;
    editor.value = JSON.stringify(request, null, 2);
    needsBuild = false;
    el('request-note').textContent = '편집기에 표시된 JSON을 그대로 전송합니다.';
  } catch (error) {
    if (version === formVersion && edit === editVersion) {
      el('form-message').textContent = error instanceof SyntaxError ? '조건의 JSON 형식을 확인하세요.' : error.message;
    }
  }
}
fields.addEventListener('input', formChanged);
fields.addEventListener('change', formChanged);
editor.addEventListener('input', () => {
  editVersion++;
  needsBuild = false;
  el('request-note').textContent = '직접 편집한 JSON을 전송합니다.';
});
for (const button of document.querySelectorAll('[data-mode]')) {
  button.addEventListener('click', () => {
    if (button.dataset.mode === mode) return;
    for (const tab of document.querySelectorAll('[data-mode]')) tab.setAttribute('aria-pressed', String(tab === button));
    mode = button.dataset.mode;
    target = '회원';
    render();
  });
}
el('build').addEventListener('click', () => void build());

function clearImage() {
  el('image-panel').hidden = true;
  el('image').removeAttribute('src');
  if (imageUrl) URL.revokeObjectURL(imageUrl);
  imageUrl = undefined;
}
function showImage(data) {
  if (data?.매체유형 !== 'image/webp' || typeof data.사진데이터 !== 'string') return;
  try {
    const bytes = Uint8Array.from(atob(data.사진데이터), character => character.charCodeAt(0));
    const header = new TextDecoder().decode(bytes.subarray(0, 12));
    if (!header.startsWith('RIFF') || !header.endsWith('WEBP')) return;
    imageUrl = URL.createObjectURL(new Blob([bytes], { type: 'image/webp' }));
    el('image').src = imageUrl;
    el('image-panel').hidden = false;
  } catch (_) { /* 응답 본문은 별도로 확인할 수 있음 */ }
}
el('image').addEventListener('error', () => {
  clearImage();
  el('message').textContent = '응답을 받았으나 WebP 미리보기를 표시할 수 없습니다.';
});
window.addEventListener('pagehide', clearImage);
function status(text, error = false, message = '') {
  el('status').textContent = text;
  el('status').dataset.error = String(error);
  el('message').textContent = message;
}
function isReadOnly(request) {
  const keys = Object.keys(request);
  if (typeof request.view === 'string' && own(viewFields, request.view)) {
    return keys.every(key => ['view','select','where'].includes(key));
  }
  return request.action === 'getPhoto' && request.table === '회원' &&
    typeof request.id === 'string' && keys.every(key => ['action','table','id'].includes(key));
}
const HTTP_API_URL = '/api';
const rpc = window.google?.script?.run;
const usesRpc = typeof rpc?.withSuccessHandler === 'function' && typeof rpc?.withFailureHandler === 'function';
const apiTransport = usesRpc ? {
  label: 'RPC',
  failureTitle: 'Apps Script 호출 오류',
  failureMessage: '서버 호출을 완료하지 못했습니다. Apps Script 실행 로그와 배포 설정을 확인하세요.',
  async call(body) {
    const raw = await new Promise((resolve, reject) => {
      rpc.withSuccessHandler(resolve).withFailureHandler(reject).runApiTest(body);
    });
    return { raw };
  }
} : {
  label: 'HTTP',
  failureTitle: 'HTTP 네트워크 오류',
  failureMessage: '서버에서 응답을 읽지 못했습니다. 연결 상태와 API 주소를 확인하세요.',
  async call(body) {
    const response = await fetch(HTTP_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body
    });
    const raw = await response.text();
    return { raw, httpError: response.ok ? undefined : response.status };
  }
};
el('transport').textContent = apiTransport.label;

async function send() {
  const button = el('send');
  if (button.disabled) return;
  clearImage();
  responseText = '';
  el('response').textContent = '';
  for (const key of ['code', 'duration']) el(key).textContent = '—';
  let payload;
  const body = editor.value;
  try {
    if (needsBuild) throw new Error('변경한 입력을 먼저 요청 JSON에 반영하세요.');
    payload = JSON.parse(body);
    if (!isObject(payload)) throw new Error('요청 JSON은 객체여야 합니다.');
    verifyPhoto?.(payload);
  } catch (error) {
    status('입력 오류', true, error instanceof SyntaxError ? '요청 JSON 문법을 확인하세요.' : error.message);
    return;
  }

  if (!isReadOnly(payload) && !window.confirm(
    `데이터를 변경할 수 있는 요청입니다.\n명령: ${payload.action ?? '미지정'}\n실제 요청을 전송할까요?`
  )) {
    status('전송 취소');
    return;
  }
  button.disabled = true;
  status('실행 중');
  const started = performance.now();
  try {
    const { raw, httpError } = await apiTransport.call(body);
    let result;
    try { result = JSON.parse(raw); } catch (_) { /* 예상하지 못한 응답 */ }
    responseText = result === undefined ? String(raw ?? '') : JSON.stringify(result, null, 2);
    el('response').textContent = responseText || '응답 본문이 비어 있습니다.';
    const error = result?.성공 === false ? result.오류 : undefined;
    if (typeof error?.코드 === 'string') el('code').textContent = error.코드;
    const errorMessage = typeof error?.메시지 === 'string' ? error.메시지 : '';
    if (httpError !== undefined) {
      status(`HTTP 오류 (${httpError})`, true, errorMessage || '서버가 HTTP 오류 응답을 반환했습니다.');
    } else if (result?.성공 === false) {
      status('API 오류', true, errorMessage || 'API가 실패 응답을 반환했습니다.');
    } else if (result?.성공 !== true) {
      status('응답 형식 오류', true, '예상한 API JSON이 아닙니다.');
    } else {
      status('요청 성공');
      if (payload.action === 'getPhoto') showImage(result.데이터);
    }
  } catch (_) {
    status(apiTransport.failureTitle, true,
      apiTransport.failureMessage + ' 변경 요청은 재전송 전에 반영 여부를 확인하세요.');
  } finally {
    el('duration').textContent = Math.round(performance.now() - started).toLocaleString('ko-KR') + ' 밀리초';
    button.disabled = false;
  }
}
async function copy(text, notice) {
  if (!text) { notice.textContent = '복사할 본문이 없습니다.'; return; }
  try {
    if (!navigator.clipboard) throw new Error();
    await navigator.clipboard.writeText(text);
  } catch (_) {
    const temp = node('textarea'); temp.value = text;
    temp.setAttribute('readonly', '');
    temp.style.position = 'fixed'; temp.style.opacity = '0';
    const previous = document.activeElement;
    document.body.append(temp);
    temp.select();
    let copied = false;
    try { copied = document.execCommand('copy'); } catch (_) { /* 수동 복사 사용 */ }
    temp.remove();
    previous?.focus();
    if (!copied) { notice.textContent = '자동 복사가 차단되었습니다. 본문을 선택해 직접 복사하세요.'; return; }
  }
  notice.textContent = '복사했습니다.';
}
el('send').addEventListener('click', () => void send());
el('copy-request').addEventListener('click', () => void copy(editor.value, el('request-note')));
el('copy-response').addEventListener('click', () => void copy(responseText, el('message')));
render();
</script>
</body>
